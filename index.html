<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rewet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#efe6cf;--dim:#a99f86;--accent:#e8b04a;--panel:#14120ecc;--line:#3a3328}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0d0b;color:var(--ink);font-family:VT323,monospace;font-size:22px;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;touch-action:none}
#intro{position:fixed;left:0;right:0;bottom:12vh;text-align:center;padding:0 16px;pointer-events:none}
#line{font-size:clamp(22px,3.4vw,34px);text-shadow:0 2px 0 #000;transition:opacity .6s}
#skip{position:fixed;right:16px;bottom:16px;font:inherit;font-size:18px;color:var(--dim);background:none;border:1px solid var(--line);padding:4px 10px;cursor:pointer}
#menu{position:fixed;left:max(16px,6vw);top:50%;transform:translateY(-50%);width:min(340px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .8s}
#menu.on{opacity:1;pointer-events:auto}
h1{font-family:Silkscreen,monospace;font-weight:400;font-size:clamp(44px,8vw,72px);margin:0;line-height:1;letter-spacing:2px;color:var(--ink);text-shadow:0 4px 0 #2d4a24}
.sub{color:var(--dim);margin:6px 0 28px}
.btn{display:block;width:100%;text-align:left;font-family:Silkscreen,monospace;font-size:18px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.btn:hover:not(:disabled)::before,.btn:focus-visible::before{content:"▶ "}
.btn:disabled{opacity:.4;cursor:default}
dialog{background:#14120e;color:var(--ink);border:2px solid var(--line);padding:20px;width:min(380px,calc(100% - 32px));font:inherit}
dialog::backdrop{background:#0008}
dialog h2{font-family:Silkscreen,monospace;font-size:20px;margin:0 0 14px}
dialog label{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
dialog p{margin:6px 0;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14120e;border:2px solid var(--accent);padding:8px 14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
#levelSelect,#report,#debrief{position:fixed;left:max(16px,6vw);top:50%;transform:translateY(-50%);width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto}
#levelSelect h2,#report h2,#debrief h2{font-family:Silkscreen,monospace;font-weight:400;font-size:24px;margin:0 0 14px}
#levelSelect .btn small{display:block;font-family:VT323,monospace;font-size:20px;color:var(--dim);margin-top:2px}
#report,#debrief{background:#14120e;border:2px solid var(--line);padding:16px}
#report p,#debrief p{margin:6px 0}
#hud{position:fixed;left:12px;top:12px;max-width:calc(100% - 24px);background:var(--panel);border:2px solid var(--line);padding:6px 10px}
#hud small{display:block;color:var(--dim);font-size:18px}
.hb{font:inherit;font-size:18px;color:var(--ink);background:none;border:1px solid var(--line);padding:2px 8px;margin:4px 4px 0 0;cursor:pointer}
.hb:hover,.hb:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.hb.on{border-color:var(--accent);color:var(--accent)}
#legend{position:relative;width:180px;height:28px;margin-top:6px;font-size:16px;color:var(--dim)}
#legendBar{position:relative;height:8px;border:1px solid var(--line)}
#legendMark{position:absolute;top:-4px;width:2px;height:14px;background:#5ff0ff}
#legend i{position:absolute;top:10px;font-style:normal;white-space:nowrap}
#legend i:nth-of-type(1){left:0}#legend i:nth-of-type(2){transform:translateX(-50%);color:#5ff0ff}#legend i:nth-of-type(3){right:0}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--line);padding:4px 8px 6px}
#barHint{font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barGroups{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.grp{display:flex;gap:4px;align-items:stretch;flex:none}
.grp span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:Silkscreen,monospace;font-size:10px;color:var(--accent);text-align:center}
.grp button{font-family:Silkscreen,monospace;font-size:12px;color:var(--ink);background:#14120e;border:2px solid var(--line);padding:4px 6px;min-width:76px;min-height:44px;cursor:pointer;text-align:left}
.grp button small{display:block;font-family:VT323,monospace;font-size:17px;color:var(--dim)}
.grp button:hover,.grp button:focus-visible{border-color:var(--dim);outline:none}
.grp button.on{border-color:var(--accent);color:var(--accent)}
.grp button.poor small{color:#c0583a}
#tip{position:fixed;z-index:5;background:#14120e;border:2px solid #c0583a;padding:2px 8px;font-size:18px;pointer-events:none}
#report canvas,#debrief canvas{display:block;width:100%;image-rendering:pixelated;border:1px solid var(--line);margin:4px 0}
#rpElNino{color:var(--accent)}
#dbStars{font-size:34px;color:var(--accent);letter-spacing:4px}
#dbThumbs{display:flex;gap:12px}#dbThumbs figure{margin:0;flex:1;text-align:center;color:var(--dim)}
#dbThumbs canvas{aspect-ratio:1;max-width:140px;margin:4px auto}
#debrief h3{font-family:Silkscreen,monospace;font-weight:400;font-size:16px;margin:12px 0 4px;color:var(--dim)}
#dbHint{color:var(--accent)}
[hidden]{display:none!important}
@media (max-width:600px){#menu{top:auto;bottom:16px;transform:none}.sub{margin-bottom:16px}#hud{left:8px;top:8px;padding:4px 8px;font-size:18px}#hudKeys{display:none!important}#report,#debrief{top:auto;bottom:8px;transform:none;max-height:calc(100% - 16px)}#report canvas,#debrief canvas:not(#dbThumbs canvas){height:80px}}
</style>
</head>
<body>
<canvas id="bg" aria-label="Pixel art peat swamp recovering from drought and fire"></canvas>

<div id="intro"><div id="line" aria-live="polite"></div></div>
<button id="skip">Skip ▸</button>

<nav id="menu" aria-label="Main menu">
  <h1>REWET</h1>
  <div class="sub">a peatland restoration game · prototype</div>
  <button class="btn" id="bNew">New game</button>
  <button class="btn" id="bCont" disabled>Continue</button>
  <button class="btn" id="bSet">Settings</button>
  <button class="btn" id="bCred">Credits</button>
</nav>

<dialog id="dSet">
  <h2>Settings</h2>
  <label>Sound <input type="checkbox" id="snd"></label>
  <button class="btn" id="bReplay">Replay intro</button>
  <button class="btn" id="bReset">Delete save</button>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<dialog id="dCred">
  <h2>Credits</h2>
  <p>Prototype. All art and sound generated in code.</p>
  <p>Fonts: Silkscreen, VT323 (Google Fonts).</p>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<div id="levelSelect" hidden>
  <h2 id="lsTitle"></h2>
  <div id="lsList"></div>
  <button class="btn" id="lsBack"></button>
</div>
<div id="hud" hidden>
  <div id="hudTime"></div><div id="hudStats"></div>
  <button class="hb" id="bPause"></button><button class="hb" id="bX1"></button><button class="hb" id="bX2"></button><button class="hb" id="bData"></button>
  <div id="legend"><div id="legendBar"><b id="legendMark"></b></div><i></i><i></i><i></i></div>
  <small id="hudKeys"></small>
</div>
<div id="bar" hidden><div id="barHint"></div><div id="barGroups"></div></div>
<div id="tip" role="status" hidden></div>
<div id="report" hidden><h2 id="rpTitle"></h2><small id="rpChartLabel"></small><canvas id="rpChart" role="img" width="312" height="110"></canvas><div id="rpBody"></div><p id="rpElNino" hidden></p><button class="btn" id="rpCont"></button></div>
<div id="debrief" hidden>
  <h2 id="dbTitle"></h2><div id="dbStars"></div><p id="dbBody"></p>
  <div id="dbThumbs"><figure><canvas id="dbBefore"></canvas><figcaption id="dbBeforeL"></figcaption></figure><figure><canvas id="dbAfter"></canvas><figcaption id="dbAfterL"></figcaption></figure></div>
  <h3 id="dbGoalsTitle"></h3><div id="dbGoals"></div><p id="dbHint"></p>
  <h3 id="dbDataTitle"></h3><canvas id="dbChart" role="img" width="312" height="110"></canvas><div id="dbData"></div>
  <button class="btn" id="dbMenu"></button>
</div>
<dialog id="dQuit"><h2 id="qTitle"></h2><p id="qBody"></p><button class="btn" id="qYes"></button><button class="btn" id="qNo" autofocus></button></dialog>
<div id="toast" role="status"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
