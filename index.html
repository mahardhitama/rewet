<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rewet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#efe6cf;--dim:#a99f86;--accent:#e8b04a;--panel:#14120ecc;--line:#3a3328}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0d0b;color:var(--ink);font-family:VT323,monospace;font-size:22px;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;touch-action:none}
#intro{position:fixed;left:0;right:0;bottom:12vh;text-align:center;padding:0 16px;pointer-events:none}
#line{font-size:clamp(22px,3.4vw,34px);text-shadow:0 2px 0 #000;transition:opacity .6s}
#skip{position:fixed;right:16px;bottom:16px;font:inherit;font-size:18px;color:var(--dim);background:none;border:1px solid var(--line);padding:4px 10px;min-height:44px;min-width:44px;cursor:pointer}
#menu{position:fixed;left:max(16px,6vw);top:50%;transform:translateY(-50%);width:min(340px,calc(100% - 32px));opacity:0;visibility:hidden;pointer-events:none;transition:opacity .8s,visibility .8s}
#menu.on{opacity:1;visibility:visible;pointer-events:auto}
h1{font-family:Silkscreen,monospace;font-weight:400;font-size:clamp(44px,8vw,72px);margin:0;line-height:1;letter-spacing:2px;color:var(--ink);text-shadow:0 4px 0 #2d4a24}
.sub{display:inline-block;font-size:18px;color:var(--dim);background:var(--panel);padding:2px 8px;margin:8px 0 24px}
.btn{display:block;width:100%;text-align:left;font-family:Silkscreen,monospace;font-size:18px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.btn:hover:not(:disabled)::before,.btn:focus-visible::before{content:"▶ "}
.btn:disabled{opacity:.4;cursor:default}
dialog{background:#14120e;color:var(--ink);border:2px solid var(--line);padding:20px;width:min(380px,calc(100% - 32px));font:inherit}
dialog::backdrop{background:#0008}
dialog h2{font-family:Silkscreen,monospace;font-size:20px;margin:0 0 14px}
dialog label{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
dialog p{margin:6px 0;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14120e;border:2px solid var(--accent);padding:8px 14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
#levelSelect,#report,#debrief{position:fixed;background:#14120e;border:2px solid var(--line);padding:16px;left:max(16px,6vw);top:50%;transform:translateY(-50%);width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto}
#levelSelect h2,#report h2,#debrief h2{font-family:Silkscreen,monospace;font-weight:400;font-size:24px;margin:0 0 14px}
#levelSelect h3{font-family:Silkscreen,monospace;font-weight:400;font-size:18px;margin:14px 0 6px}
#levelSelect #lsStars{color:var(--accent);font-family:VT323,monospace;font-size:22px;margin-bottom:6px}
#levelSelect .btn small{display:block;font-family:VT323,monospace;font-size:20px;color:var(--dim);margin-top:2px}
#levelSelect .btn small.lock{display:inline;float:right;margin:0}
#report p,#debrief p{margin:6px 0}
#hud{position:fixed;left:12px;top:12px;max-width:calc(100% - 24px);background:var(--panel);border:2px solid var(--line);padding:6px 10px}
#hud small{display:block;color:var(--dim);font-size:18px}
#hudStats{display:flex;flex-wrap:wrap;column-gap:.6em}#hudStats span{white-space:nowrap}
.hb{font:inherit;font-size:18px;color:var(--ink);background:none;border:1px solid var(--line);padding:2px 8px;margin:4px 4px 0 0;min-width:44px;min-height:44px;cursor:pointer}
.hb:hover{border-color:var(--accent);color:var(--accent)}
.hb:focus-visible,#zoom button:focus-visible{outline:2px solid var(--dim);outline-offset:1px} /* an outline, so the ring also shows on a selected button */
.hb.on{border-color:var(--accent);color:var(--accent)}
#legend{position:relative;width:180px;height:28px;margin-top:6px;font-size:16px;color:var(--dim)}
#legendBar{position:relative;height:8px;border:1px solid var(--line)}
#legendMark{position:absolute;top:-4px;width:2px;height:14px;background:#5ff0ff}
#legend i{position:absolute;top:10px;font-style:normal;white-space:nowrap}
#legend i:nth-of-type(1){left:0}#legend i:nth-of-type(2){transform:translateX(-50%);color:#5ff0ff}#legend i:nth-of-type(3){right:0}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--line);padding:4px 8px 6px}
#barTop{display:flex;align-items:center;gap:8px}
#barHint{flex:1;min-width:0;font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barTabs{display:none}
#barRow{display:flex}
#barGroups{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scroll-snap-type:x proximity}
.grp{display:flex;flex-direction:column;gap:2px;flex:none;scroll-snap-align:start}
.grp>span{font-family:Silkscreen,monospace;font-size:10px;line-height:12px;color:var(--accent)}
.grp>div{display:flex;gap:4px}
#barMore{position:relative;flex:none;width:20px;margin-bottom:2px;border-left:2px solid var(--line)} /* beside the scroll area, so it covers no button */
#barMore::after{content:"";position:absolute;left:5px;top:50%;margin-top:-7px;border-left:8px solid var(--accent);border-block:7px solid transparent}
#barTabs button,.grp button{font-family:Silkscreen,monospace;font-size:12px;color:var(--ink);background:#14120e;border:2px solid var(--line);padding:4px 6px;min-width:76px;min-height:44px;cursor:pointer;text-align:left}
.grp button small{display:block;font-family:VT323,monospace;font-size:17px;color:var(--dim)}
#barTabs button:hover,.grp button:hover{border-color:var(--dim)}
#barTabs button:focus-visible,.grp button:focus-visible{outline:2px solid var(--dim);outline-offset:1px} /* an outline, so the ring also shows on the selected button */
.grp button.on{border-color:var(--accent);color:var(--accent)}
.grp button.poor small{color:#c0583a}
#barTabs button{flex:auto;min-width:44px;padding:4px;font-size:10px;text-align:center}
#barTabs button.on{border-color:var(--accent);color:var(--accent)}
@media (max-width:359px){#barTabs button{font-size:8px;padding:4px 2px}} /* the 4 tab names fit at 320 px */
#zoom{flex:none;position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
#zoom button{width:44px;height:44px;font-family:Silkscreen,monospace;font-size:14px;white-space:nowrap;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:0;cursor:pointer}
#zoom button:hover{border-color:var(--accent);color:var(--accent)}
#tip{position:fixed;z-index:5;background:#14120e;border:2px solid #c0583a;padding:2px 8px;font-size:18px;pointer-events:none}
#report canvas,#debrief canvas{display:block;width:100%;image-rendering:pixelated;border:1px solid var(--line);margin:4px 0}
#rpElNino{color:var(--accent)}
#dbStars{font-size:34px;color:var(--accent);letter-spacing:4px}
#dbThumbs{display:flex;gap:12px}#dbThumbs figure{margin:0;flex:1;text-align:center;color:var(--dim)}
#dbThumbs canvas{aspect-ratio:1;max-width:140px;margin:4px auto}
#debrief h3{font-family:Silkscreen,monospace;font-weight:400;font-size:16px;margin:12px 0 4px;color:var(--dim)}
#dbHint{color:var(--accent)}
/* journal: a book. 2 pages side by side, or 1 page on a phone (journalView.js adds .one) */
#dJournal{width:min(920px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px}
#jHead{display:flex;align-items:center;gap:4px 12px;margin-bottom:10px}
#jHead h2{margin:0;flex:none}
#jCount{flex:1;color:var(--accent);font-size:20px}
.jb{font-family:Silkscreen,monospace;font-size:14px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:4px 12px;min-width:44px;min-height:44px;cursor:pointer}
.jb:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.jb:focus-visible,.jc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jb:disabled{opacity:.4;cursor:default}
#jBook{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);background:#1b1810;height:min(500px,calc(100dvh - 230px));min-height:240px} /* a fixed height, so the dialog does not jump between pages */
#jBook.one{grid-template-columns:1fr}
.jPage{display:flex;flex-direction:column;overflow:auto;padding:14px 16px}
#jBook:not(.one) .jPage+.jPage{border-left:2px solid var(--line)}
.jPage h3{font-family:Silkscreen,monospace;font-weight:400;font-size:18px;margin:0 0 10px;color:var(--accent)}
.jPage p{margin:0 0 8px;color:var(--ink)}
.jPage em{color:var(--dim)}
.jPage .jSrc{margin-top:auto;padding-top:10px;font-size:16px;color:var(--dim)}
.jc{display:block;width:100%;min-height:44px;text-align:left;font:inherit;font-size:20px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:4px 6px;cursor:pointer}
.jc:hover{color:var(--accent)}
.jSprite{width:96px;height:96px;border:2px solid var(--line);background:#14120e;display:flex;align-items:center;justify-content:center;margin:0 0 10px;font-family:Silkscreen,monospace;font-size:40px;color:var(--dim)}
.jSt{display:inline-block;border:1px solid var(--accent);color:var(--accent);padding:0 6px;font-size:18px}
#jNav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
#jPos{color:var(--dim);text-align:center}
#jHint{display:block;margin-top:6px;color:var(--dim);font-size:16px}
@media (pointer:coarse){#jHint{display:none}}
@media (max-width:600px){#jHead{flex-wrap:wrap}#jHead h2{flex:1}#jCount{order:3;flex-basis:100%}}
[hidden]{display:none!important}
@media (pointer:coarse){#hudKeys{display:none!important}}
/* short landscape: the HUD is one row (text, buttons, legend) so the map band stays tall. It wraps to 2 rows on a narrow window. max-width keeps it clear of the zoom column. */
@media (max-height:500px){#hud{left:8px;top:8px;max-width:calc(100% - 80px);padding:4px 8px;font-size:18px;display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap}#hudText{flex:1 1 280px;min-width:0;display:flex;flex-wrap:wrap;column-gap:.6em}#hudStats{display:contents}.hb{margin:0}#legend{flex:none;margin:0}#hudKeys{display:none!important}}
/* very short window: smaller HUD text, and the zoom buttons are a row, because a 144 px column does not fit between the HUD and the bar */
@media (max-height:360px){#hud{font-size:16px;max-width:calc(100% - 16px)}#barHint{font-size:16px}#zoom{flex-direction:row;gap:4px}}
/* portrait phone (short landscape is excluded, its rules above win): the zoom buttons move into the action bar, the hint gets 3 lines, and tabs show one action group */
@media (max-width:600px) and (min-height:501px){#zoom{position:static;transform:none;flex-direction:row;gap:4px}#barHint{font-size:16px;line-height:15px;height:45px;white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
#barTabs{display:flex;gap:4px;margin:4px 0}.grp:not(.cur){display:none}.grp>span{display:none}}
@media (max-width:600px){#menu{top:auto;bottom:16px;transform:none}.sub{margin-bottom:16px}#hud{left:8px;top:8px;padding:4px 8px;font-size:18px}#hudKeys{display:none!important}#report,#debrief{top:auto;bottom:8px;transform:none;max-height:calc(100% - 16px)}#report canvas,#debrief canvas:not(#dbThumbs canvas){height:80px}}
</style>
</head>
<body>
<canvas id="bg" aria-label="Pixel art peat swamp recovering from drought and fire"></canvas>

<div id="intro"><div id="line" aria-live="polite"></div></div>
<button id="skip">Skip ▸</button>

<nav id="menu" aria-label="Main menu">
  <h1>REWET</h1>
  <div class="sub">a peatland restoration game&nbsp;·&nbsp;prototype</div>
  <button class="btn" id="bNew">New game</button>
  <button class="btn" id="bCont" disabled>Continue</button>
  <button class="btn" id="bJrnMenu">Journal</button>
  <button class="btn" id="bSet">Settings</button>
  <button class="btn" id="bCred">Credits</button>
</nav>

<dialog id="dSet">
  <h2>Settings</h2>
  <label>Sound <input type="checkbox" id="snd"></label>
  <button class="btn" id="bReplay">Replay intro</button>
  <button class="btn" id="bReset">Delete save</button>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<dialog id="dCred">
  <h2>Credits</h2>
  <p>Prototype. All art and sound generated in code.</p>
  <p>Fonts: Silkscreen, VT323 (Google Fonts).</p>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<div id="levelSelect" hidden>
  <h2 id="lsTitle"></h2>
  <div id="lsList"></div>
  <div id="lsUp"><h3 id="lsUpTitle"></h3><div id="lsStars"></div><div id="lsUpList"></div></div>
  <button class="btn" id="lsBack"></button>
</div>
<div id="hud" hidden>
  <div id="hudText"><div id="hudTime"></div><div id="hudStats"></div></div>
  <button class="hb" id="bPause"></button><button class="hb" id="bX1"></button><button class="hb" id="bX2"></button><button class="hb" id="bData"></button><button class="hb" id="bJournal"></button>
  <div id="legend"><div id="legendBar"><b id="legendMark"></b></div><i></i><i></i><i></i></div>
  <small id="hudKeys"></small>
</div>
<div id="bar" hidden>
  <div id="barTop"><div id="barHint"></div><div id="zoom" role="group"><button id="bZoomIn"></button><button id="bZoomOut"></button><button id="bZoomFit"></button></div></div>
  <div id="barTabs" role="group"></div>
  <div id="barRow"><div id="barGroups"></div><div id="barMore" aria-hidden="true" hidden></div></div>
</div>
<div id="tip" role="status" hidden></div>
<div id="report" hidden><h2 id="rpTitle"></h2><small id="rpChartLabel"></small><canvas id="rpChart" role="img" width="312" height="110"></canvas><div id="rpBody"></div><p id="rpElNino" hidden></p><button class="btn" id="rpCont"></button></div>
<div id="debrief" hidden>
  <h2 id="dbTitle"></h2><div id="dbStars"></div><p id="dbBody"></p>
  <div id="dbThumbs"><figure><canvas id="dbBefore"></canvas><figcaption id="dbBeforeL"></figcaption></figure><figure><canvas id="dbAfter"></canvas><figcaption id="dbAfterL"></figcaption></figure></div>
  <h3 id="dbGoalsTitle"></h3><div id="dbGoals"></div><p id="dbHint"></p>
  <h3 id="dbDataTitle"></h3><canvas id="dbChart" role="img" width="312" height="110"></canvas><div id="dbData"></div>
  <button class="btn" id="dbMenu"></button>
</div>
<dialog id="dJournal" aria-labelledby="jTitle">
  <div id="jHead"><h2 id="jTitle"></h2><span id="jCount"></span><button class="jb" id="jClose" autofocus></button></div>
  <div id="jBook"></div>
  <div id="jNav"><button class="jb" id="jPrev"></button><span id="jPos" aria-live="polite"></span><button class="jb" id="jNext"></button></div>
  <small id="jHint"></small>
</dialog>
<dialog id="dQuit"><h2 id="qTitle"></h2><p id="qBody"></p><button class="btn" id="qYes"></button><button class="btn" id="qNo" autofocus></button></dialog>
<div id="toast" role="status"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
