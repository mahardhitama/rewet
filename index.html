<style>
:root{--ink:#efe6cf;--dim:#a99f86;--accent:#e8b04a;--panel:#14120ecc;--line:#3a3328;--c-time:#9cc4ff;--c-funds:#f2d16b;--c-crew:#ff9d6e;--c-good:#f58fc0;--c-wet:#5ff0ff;--c-score:#8fe08a;--c-rewet:var(--c-wet);--c-reveg:var(--c-score);--c-revit:var(--c-good);--c-defense:var(--c-crew);--fs-label:14px;--fs-body:16px;--fs-head:24px;--fs-title:clamp(64px,14vw,144px);--hi:#5a4f3c;--sh:#000a;--bad:#c0583a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0d0b;color:var(--ink);font-family:Silkscreen,monospace;font-size:var(--fs-body);overflow:hidden;touch-action:manipulation}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;touch-action:none}
/* A fire burns: a hard-edged frame of 3 bands, red, orange and amber, that steps through the colours. Reduced motion: it stays still. */
#fireEdge{position:fixed;inset:0;z-index:30;pointer-events:none;visibility:hidden;--f1:#e0301e;--f2:#ff7a1e;--f3:#ffb43a;box-shadow:inset 0 0 0 4px var(--f1),inset 0 0 0 8px var(--f2),inset 0 0 0 12px color-mix(in srgb,var(--f3) 45%,transparent);animation:fireEdge .9s steps(1) infinite}
body.burning #fireEdge{visibility:visible}
#fireTag{position:absolute;top:calc(100% + 10px);left:50%;translate:-50% 0;display:none;pointer-events:none;font-size:var(--fs-head);line-height:1;letter-spacing:2px;color:var(--f3);background:#14120e;border:2px solid var(--f1);padding:6px 12px;--f1:#e0301e;--f2:#ff7a1e;--f3:#ffb43a;animation:fireEdge .9s steps(1) infinite} /* FIRE! tag under the HUD while a tile burns; its border steps with #fireEdge */
#fireTag b{font-weight:inherit;font-size:var(--fs-label);letter-spacing:1px;color:var(--f2)}
body.burning #fireTag{display:block}
@keyframes fireEdge{0%{--f1:#e0301e;--f2:#ff7a1e;--f3:#ffb43a}33%{--f1:#ff7a1e;--f2:#ffb43a;--f3:#e0301e}66%{--f1:#ffb43a;--f2:#e0301e;--f3:#ff7a1e}}
#intro{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
#line{font-size:var(--fs-head);text-shadow:0 2px 0 #0e0d0b,0 0 8px #0e0d0bd9;padding:12px 16px;max-width:min(640px,100% - 32px);text-align:center;transition:opacity .6s}
#skip,.jb,.btn{display:grid;grid-template-columns:24px 1fr 24px;align-items:center;gap:8px;text-align:center}
#skip{position:fixed;right:16px;bottom:16px;font-family:Silkscreen,monospace;font-size:var(--fs-label);color:var(--dim);background:none;border:1px solid var(--line);padding:4px 8px;min-height:44px;cursor:pointer}
#skip:hover,#skip:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
#menu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;min-width:min(360px,calc(100% - 32px));max-width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;text-align:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .8s,visibility .8s}
#menu.on{opacity:1;visibility:visible;pointer-events:auto}
#ver{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);font-size:var(--fs-label);color:var(--dim);background:var(--panel);padding:2px 8px;opacity:0;transition:opacity .8s;pointer-events:none}
#menu.on+#ver{opacity:1}
h1{display:flex;justify-content:center;white-space:nowrap;font-family:Silkscreen,monospace;font-weight:400;font-size:var(--fs-title);margin:0;line-height:1;letter-spacing:4px;color:var(--ink);text-shadow:0 5px 0 #2d4a24,0 8px 0 var(--c-wet),0 11px 0 #0e0d0bcc}

.btn{width:100%;font-family:Silkscreen,monospace;font-size:var(--fs-label);color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:8px 12px;min-height:44px;margin-bottom:8px;cursor:pointer}
.t{min-width:0}
.tree{visibility:hidden;color:var(--c-score)}

:is(.btn,.jb,#skip):hover:not(:disabled) .tree,:is(.btn,.jb,#skip):focus-visible .tree{visibility:visible}
.btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.btn[aria-pressed=true]{color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
dialog{position:fixed;inset:auto;left:50%;top:50%;margin:0;transform:translate(-50%,-50%);max-height:calc(100% - 32px);overflow:auto;background:#14120e;color:var(--ink);border:2px solid var(--line);padding:20px;width:min(380px,calc(100% - 32px));font:inherit}

#menu .btn{display:grid;max-width:360px;margin-inline:auto}

.metrics td:nth-child(2):not(:last-child),.metrics th:nth-child(2):not(:last-child){text-align:left}

#menuStats{max-width:360px;margin:16px auto 0;background:var(--panel)}
#menuStats td{padding:4px 8px}
/* short landscape: a smaller title and 2 button columns, so the menu fits with no scroll */
@media (max-height:500px){:root{--fs-title:clamp(40px,14vh,64px)}#menu{display:grid;grid-template-columns:repeat(2,minmax(0,360px));column-gap:8px;justify-content:center}#menu>h1,#menu>.sub,#menu>#menuStats{grid-column:1/-1;justify-self:center}#menu .sub{margin:4px 0 12px}#menu .btn{max-width:none}#menuStats{margin-top:8px}}
#scenic{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;display:flex;align-items:center;gap:12px;background:#14120ee6;border:2px solid var(--line);padding:8px 8px 8px 14px;max-width:calc(100% - 32px);box-shadow:0 4px 0 #0e0d0bcc}

#levelSelect,#report,#debrief{position:fixed;background:#14120e;border:2px solid var(--line);padding:16px;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto}
/* 6px orange scrollbar, always shown when content overflows (WebKit replaces the macOS overlay bar) */
:is(dialog,#menu,#levelSelect,#report,#debrief,.jPage)::-webkit-scrollbar{width:6px;height:6px}
:is(dialog,#menu,#levelSelect,#report,#debrief,.jPage)::-webkit-scrollbar-track{background:#0e0d0b}
:is(dialog,#menu,#levelSelect,#report,#debrief,.jPage)::-webkit-scrollbar-thumb{background:var(--accent)}
@supports not selector(::-webkit-scrollbar){dialog,#menu,#levelSelect,#report,#debrief,.jPage{scrollbar-color:var(--accent) #0e0d0b;scrollbar-width:thin}}
#levelSelect h2,#report h2,#debrief h2{font-family:Silkscreen,monospace;font-weight:400;font-size:var(--fs-head);margin:0 0 14px}
#report h2,#debrief h2{text-align:center}
#levelSelect h3{font-family:Silkscreen,monospace;font-weight:400;font-size:var(--fs-label);margin:14px 0 6px}
#levelSelect #lsStars{color:var(--accent);font-family:Silkscreen,monospace;font-size:var(--fs-body);margin-bottom:6px}
.lsBest{display:flex;justify-content:center;gap:4px;margin:6px 0 2px;color:var(--hi)}
.lsBest svg{display:block}
.lsBest .on{color:var(--c-funds);filter:drop-shadow(0 1px 0 #0e0d0b)}
#levelSelect .btn small{display:block;font-family:Silkscreen,monospace;font-size:var(--fs-body);color:var(--dim);margin-top:2px}
#report p,#debrief p{margin:6px 0}
/* a grid, so the legend can sit under the row: width:max-content gives the centred box its full content width */
#hud{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 16px);display:grid;grid-template-columns:auto auto;align-items:center;column-gap:8px;white-space:nowrap;background:var(--panel);border:2px solid var(--line);padding:4px 8px}
#hudRow,#hudBtns{display:flex;align-items:center}
#hudBtns{gap:4px}
.part{--pc:var(--ink);display:flex;align-items:center;gap:4px;padding:0 8px;border-left:2px solid var(--line)}
#hudRow>.part:first-child{border-left:0}
.part[data-id=time]{--pc:var(--c-time)}.part[data-id=funds]{--pc:var(--c-funds)}.part[data-id=crew]{--pc:var(--c-crew)}.part[data-id=goodwill]{--pc:var(--c-good)}.part[data-id=wet]{--pc:var(--c-wet)}.part[data-id=score]{--pc:var(--c-score)}

.part .l{font-family:Silkscreen,monospace;font-weight:400;font-size:var(--fs-label)}
.part .v{color:var(--ink)}
.sep{width:2px;height:24px;margin-left:8px;background:var(--line)}
.hb{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:var(--fs-body);color:var(--ink);background:none;border:1px solid var(--line);padding:2px 8px;min-width:44px;min-height:44px;cursor:pointer}
.hb svg{flex:none}
.hb:hover{border-color:var(--accent);color:var(--accent)}
.hb:focus-visible,#zoom button:focus-visible{outline:2px solid var(--dim);outline-offset:1px} /* an outline, so the ring also shows on a selected button */
.hb.on{border-color:var(--accent);color:var(--accent)}
#legend{grid-column:1/-1;display:flex;justify-content:center;margin-top:4px}
#legend[hidden]{display:none}
#legendIn{position:relative;width:240px;height:28px;font-size:var(--fs-body);color:var(--dim)}
#legendBar{position:relative;height:8px;border:1px solid var(--line)}

#legendIn i{position:absolute;top:10px;font-style:normal;white-space:nowrap}
#legendIn i:nth-of-type(1){left:0}#legendIn i:nth-of-type(2){transform:translateX(-50%);color:#5ff0ff}#legendIn i:nth-of-type(3){right:0}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);border-top:2px solid var(--line);padding:4px 8px 6px}
#barName,#barHint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px} /* one line each, so the bar height and the map stay fixed */
#barName{max-width:100%;min-height:16px;font-family:Silkscreen,monospace;font-size:var(--fs-label);line-height:16px;text-align:center;color:var(--dim)}
#barHint{max-width:100%;min-height:16px;font-family:Silkscreen,monospace;font-size:var(--fs-label);line-height:16px;text-align:center;color:var(--dim)}
#barName.sel{color:var(--ink)}
#barRow{display:flex;align-items:center;justify-content:center;gap:8px;max-width:100%}
#slots{display:flex;justify-content:center;gap:4px} /* the same 4 px gap as between the slots */
.row{display:flex;gap:4px}
.slot{--c:var(--c-rewet);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;width:64px;height:80px;box-sizing:border-box;padding:0;font-family:Silkscreen,monospace;font-size:var(--fs-label);line-height:1;color:var(--ink);background:#14120e;border:2px solid var(--line);border-top:5px solid var(--c);cursor:pointer}
.slot[data-r=reveg]{--c:var(--c-reveg)}.slot[data-r=revit]{--c:var(--c-revit)}.slot[data-r=defense]{--c:var(--c-defense)}
.slot small{font:inherit;color:var(--dim)}
.slot .tag{line-height:1;white-space:nowrap}
.slot:hover{border-color:var(--accent);border-top-color:var(--c)}
.slot:focus-visible{outline:2px solid var(--dim);outline-offset:1px} /* an outline, so the ring also shows on the selected slot */
.slot.on{border-color:var(--accent);border-top-color:var(--c);color:var(--accent)}

/* 10 slots of 64 px and 9 gaps need 676 px, so the 48 px slots go up to 719 px wide */
@media (max-width:719px),(max-height:500px){.slot{width:48px;height:60px;gap:1px;font-size:12px}}
#zoom{flex:none;position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
#zoom button{width:44px;height:44px;font-family:Silkscreen,monospace;font-size:var(--fs-label);white-space:nowrap;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:0;cursor:pointer}
#zoom button:hover{border-color:var(--accent);color:var(--accent)}
#flow{width:44px;height:44px;box-sizing:border-box;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line)} /* the water flow tile: the way the canals drain off the site */
#flow[hidden]{display:none}
#flowCv{width:40px;height:24px;image-rendering:pixelated}
#tip{position:fixed;z-index:5;background:#14120e;border:2px solid #c0583a;padding:2px 8px;font-size:var(--fs-body);pointer-events:none}
#report canvas,#debrief canvas{display:block;width:100%;image-rendering:pixelated;border:1px solid var(--line);margin:4px 0}
#rpElNino{color:var(--accent)}
#dbStars{margin:8px 0}
#dbBody{text-align:center}
#dbThumbs{display:flex;gap:12px}#dbThumbs figure{margin:0;flex:1;text-align:center;color:var(--dim)}
#dbThumbs canvas{aspect-ratio:1;max-width:140px;margin:4px auto}
#debrief h3{font-family:Silkscreen,monospace;font-weight:400;font-size:var(--fs-label);margin:12px 0 4px;color:var(--dim)}
#dbHint{color:var(--accent)}
/* journal: a book. 2 pages side by side, or 1 page on a phone (journalView.js adds .one) */
#dJournal{width:min(920px,calc(100% - 24px));max-height:calc(100% - 24px);padding:12px}
#jHead{display:flex;align-items:center;gap:4px 12px;margin-bottom:10px}
#jHead h2{margin:0;flex:1;text-align:center}
.srcLink{display:inline-block;vertical-align:middle;margin-left:2px;color:var(--accent)}
.srcLink:hover,.srcLink:focus-visible{color:var(--ink)}
.srcLink svg{display:block}
.jSrc .nw{white-space:nowrap}
.jb{font-family:Silkscreen,monospace;font-size:var(--fs-label);color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:4px 12px;min-width:44px;min-height:44px;cursor:pointer}
.jb:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}

#jBook{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);background:#1b1810;height:min(500px,calc(100dvh - 230px));min-height:240px} /* a fixed height, so the dialog does not jump between pages */
#jBook.one{grid-template-columns:1fr}

.jPage em{color:var(--dim)}
.jPage h3+.jc~h3{margin-top:16px}
.jPage h4{font-family:Silkscreen,monospace;font-weight:400;font-size:var(--fs-body);margin:6px 0 6px;color:var(--dim)}

.jTiles canvas{width:96px;height:auto;image-rendering:pixelated}
.jTiles span{display:flex;flex-direction:column;align-items:center;gap:4px}.jTiles small{font-size:var(--fs-label);color:var(--dim)}
.jActs{list-style:none;margin:0 0 10px;padding:0}

.jPage .jSrc{margin-top:auto;padding-top:10px;font-size:var(--fs-body);color:var(--dim)}
.jc{display:block;width:100%;min-height:44px;text-align:left;font:inherit;font-size:var(--fs-body);color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:4px 6px;cursor:pointer}

@keyframes jWalk{0%{transform:translateX(-12px)}45%{transform:translateX(12px)}50%{transform:translateX(12px) scaleX(-1)}95%{transform:translateX(-12px) scaleX(-1)}100%{transform:translateX(-12px)}}
@keyframes jHop{50%{translate:0 -6px}}

/* journal diagrams (journalArt.js): classes are colours. s* is a line. */
.jArt{display:block;width:100%;max-width:400px;height:auto;margin:0 0 10px;background:#14120e;border:2px solid var(--line);font-family:Silkscreen,monospace;font-size:8px}
.jArt .w{fill:var(--c-wet)}.jArt .wd{fill:#1d4a55}.jArt .d{fill:#4a3a28}.jArt .g{fill:var(--c-reveg)}.jArt .f{fill:var(--c-crew)}.jArt .fd{fill:#5a3020}
.jArt .a{fill:var(--accent)}.jArt .i{fill:var(--ink)}.jArt .m{fill:var(--dim)}.jArt .p{fill:var(--c-revit)}.jArt .bx{fill:none;stroke:var(--line);stroke-width:2}.jArt .bg{fill:#14120e}.jArt .z{font-size:6px}.jArt .bgt{fill:#14120e}

#dFind{width:min(460px,calc(100% - 24px));max-height:calc(100% - 24px);border-color:var(--accent)}
#dFind h2{color:var(--accent)}
#fBody .jPage{overflow:visible;padding:12px 0 4px;border-top:2px solid var(--line);margin-top:10px}

#dHow{width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px)}
#hSub{text-align:center;margin:-8px 0 8px}
#hMap{display:block;width:100%;height:min(300px,38dvh);image-rendering:pixelated;background:#0e0d0b;border:2px solid var(--line);box-sizing:border-box} /* the level map, zoomed in on the demo */
#hCap{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:10px 0;min-height:96px}
#hCap .ic{--c:var(--line);display:flex;align-items:center;justify-content:center;width:44px;height:44px;box-sizing:border-box;background:#14120e;border:2px solid var(--line);border-top:5px solid var(--c);color:var(--ink)}
#hCap .ic[data-r=rewet]{--c:var(--c-rewet)}#hCap .ic[data-r=reveg]{--c:var(--c-reveg)}#hCap .ic[data-r=revit]{--c:var(--c-revit)}#hCap .ic[data-r=defense]{--c:var(--c-defense)}
#hCap .ic.on{background:var(--c);color:#14120e} /* the button press, when the demo does its action */
#hName{font-family:Silkscreen,monospace;font-weight:400;font-size:var(--fs-label);color:var(--ink)}
#hText{margin:2px 0 0}
#hNav{display:flex;align-items:center;justify-content:space-between;gap:8px}
#hPos{color:var(--dim)}
#dMenu .btn:last-child{margin-bottom:0}
#hHint{display:block;color:var(--dim);text-align:center;margin-bottom:12px}
#jNav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
#jPos{color:var(--dim);text-align:center}
#jHint{display:block;margin-top:6px;color:var(--dim);font-size:var(--fs-body)}
@media (pointer:coarse){#jHint{display:none}}
@media (max-width:600px){.jb{grid-template-columns:24px 1fr;gap:4px;padding:4px 8px}.jb .tree{display:none}#jPos{min-width:0}}
[hidden]{display:none!important}
#hudKeys{display:block;margin-top:4px;color:var(--dim);font-size:var(--fs-body)}
@media (pointer:coarse),(max-width:600px),(max-height:500px){#hudKeys{display:none}}
/* Narrow windows drop width in steps, so the HUD stays one row at the widest value (funds 123456). Measured with Silkscreen:
   the row needs 1822 px with the labels and the button text, 1402 px with the labels only, and 930 px with neither (Help and Menu add 88 to 96 px).
   Under 1850 px the button text hides (the name stays in aria-label) and the time value is short (src/ui.js uses the same query);
   under 1430 px, and in short landscape, the labels hide too. */
@media (max-width:1849px),(max-height:500px){.hb .t{display:none}}
#bHelp .t,#bMenu .t{display:none} /* icon only at every width: the name is in aria-label and the tooltip */
@media (max-width:1429px),(max-height:500px){.part .l{display:none}.part{padding:0 4px}.sep{margin-left:4px}}
/* the HUD is 2 rows (parts, then buttons) up to 956 px wide: one row needs 930 px. Short landscape keeps one row from 1024 px: its row is 922 px and the HUD leaves 80 px for the zoom buttons. Under 480 px the parts and the buttons wrap. */
@media (max-width:956px) and (min-height:501px),(max-width:1023px){#hud{grid-template-columns:auto;max-width:calc(100% - 8px);padding:4px 0}.sep{display:none}#hudBtns{justify-self:center}.part{gap:2px;padding:0 2px}}
/* the dividers go, so a wrapped part shows no divider at a line start */
@media (max-width:480px){#hudRow,#hudBtns{flex-wrap:wrap;justify-content:center}#hudRow{gap:4px 8px}.part{border-left:0}}
@media (max-height:500px) and (min-width:601px){#hud{max-width:calc(100% - 80px);left:calc(50% - 32px)}}
/* very short window: smaller HUD text, and the zoom buttons are a row, because a 144 px column does not fit between the HUD and the bar */
@media (max-height:360px){#hud{max-width:calc(100% - 16px);left:50%}#zoom{flex-direction:row;gap:4px}}
/* portrait phone (short landscape is excluded, its rules above win): the 2 slot rows stack, and the zoom column floats at the right edge just above the bar (the bar is its positioned parent); the find toast keeps clear of that column */
/* the slots stretch to fill the bar width; the max-width keeps the 4-slot row at the same slot width as the 5-slot row (4 gaps of 4 px = 16 px) */
@media (max-width:600px) and (min-height:501px){#barRow{width:100%}#slots{flex-direction:column;align-items:stretch;gap:4px;width:100%}.row{justify-content:center}.slot{flex:1 1 0;width:auto;min-width:48px;max-width:calc((100% - 16px) / 5)}#zoom{position:absolute;top:auto;right:12px;bottom:100%;margin-bottom:10px;transform:none}}
@media (max-width:600px){:root{--fs-body:14px}.sub{margin-bottom:16px}#report canvas,#debrief canvas:not(#dbThumbs canvas){height:80px}}
/* ---- indie polish: pixel frames, tactile buttons, pop-in. Motion uses translate/scale/opacity/colour only (never layout), and the individual properties, because the panels centre with transform. ---- */
#levelSelect,#report,#debrief,dialog,#hud,.btn,.slot,#toast,.hb,.jb,#zoom button,#flow,#fireTag{box-shadow:inset 0 0 0 1px var(--hi),0 var(--sy,4px) 0 var(--sh)}
#bar{box-shadow:inset 0 0 0 1px var(--hi),0 -4px 0 var(--sh)}
.btn,.slot,.hb,.jb,#zoom button{transition:translate .08s steps(2),box-shadow .08s steps(2)}
@media (hover:hover){:is(.btn,.slot,.hb,.jb,#zoom button):hover:not(:disabled){translate:0 -2px;--sy:6px}}
:is(.btn,.slot,.hb,.jb,#zoom button):active:not(:disabled){translate:0 2px;--sy:2px}
.slot.on{box-shadow:inset 0 0 0 1px var(--hi),0 0 0 2px var(--accent),0 0 0 3px #e8b04a55,0 4px 0 3px var(--sh);animation:slotBob 1.2s steps(1) infinite}
@keyframes slotBob{50%{translate:0 -2px}}
.slot.poor{filter:saturate(.35) brightness(.75)}
@keyframes pop{from{opacity:0;scale:.88}}
@keyframes barIn{from{opacity:0;translate:0 12px}}
@keyframes fadeIn{from{opacity:0}}
@keyframes menuIn{from{opacity:0;translate:0 10px}}
#levelSelect:not([hidden]),#report:not([hidden]),#debrief:not([hidden]),dialog[open],#hud:not([hidden]),#toast.on{animation:pop .2s steps(4) backwards}
#bar:not([hidden]){animation:barIn .2s steps(4) backwards}
h1 span{display:inline-block;animation:bob 2.4s steps(2) infinite;animation-delay:calc(var(--k,0) * -.3s)}
h1 span:nth-child(2){--k:1}h1 span:nth-child(3){--k:2}h1 span:nth-child(4){--k:3}h1 span:nth-child(5){--k:4}h1 span:nth-child(6){--k:5}
@keyframes bob{50%{translate:0 -4px}}
#menu.on>.sub,#menu.on>.btn,#menu.on>#menuStats{animation:menuIn .4s steps(4) backwards;animation-delay:calc(var(--i,1) * .08s)}
#menu>:nth-child(2){--i:1}#menu>:nth-child(3){--i:2}#menu>:nth-child(4){--i:3}#menu>:nth-child(5){--i:4}#menu>:nth-child(6){--i:5}#menu>:nth-child(7){--i:6}#menu>:nth-child(8){--i:7}
.part .v.up{--bc:var(--c-score)}.part .v.dn{--bc:var(--bad)}
.part .v.up,.part .v.dn{animation:bump .45s steps(1,start)}
@keyframes bump{33%{scale:1.25;color:var(--bc)}66%{scale:1;color:var(--bc)}}
#dbStars .on{animation:starPop .4s steps(1,start) backwards;animation-delay:var(--d,0s)}
@keyframes starPop{0%{scale:0}25%{scale:1.5;filter:drop-shadow(2px 0 0 #f2d16b) drop-shadow(-2px 0 0 #f2d16b) drop-shadow(0 2px 0 #f2d16b) drop-shadow(0 -2px 0 #f2d16b)}60%{scale:.9;filter:drop-shadow(0 -2px 0 #f2d16b)}100%{scale:1}}
#report #rpChart{animation:fadeIn .3s steps(3) backwards;animation-delay:.15s}
#rpBody tbody tr{animation:fadeIn .3s steps(3) backwards;animation-delay:calc(.3s + var(--i,8) * .07s)}
#rpBody tr:nth-child(1){--i:0}#rpBody tr:nth-child(2){--i:1}#rpBody tr:nth-child(3){--i:2}#rpBody tr:nth-child(4){--i:3}#rpBody tr:nth-child(5){--i:4}#rpBody tr:nth-child(6){--i:5}#rpBody tr:nth-child(7){--i:6}#rpBody tr:nth-child(8){--i:7}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-label="Pixel art peat swamp recovering from drought and fire"></canvas>
<div id="fireEdge" aria-hidden="true"></div>

<div id="intro"><div id="line" aria-live="polite"></div></div>
<button id="skip"></button>

<nav id="menu" aria-label="Main menu">
  <h1 aria-label="Re-Wet"><span aria-hidden="true">R</span><span aria-hidden="true">E</span><span aria-hidden="true">-</span><span aria-hidden="true">W</span><span aria-hidden="true">E</span><span aria-hidden="true">T</span></h1>
  <div class="sub">a peatland restoration game</div>
  <button class="btn" id="bNew">New game</button>
  <button class="btn" id="bCont" disabled>Continue</button>
  <button class="btn" id="bJrnMenu">Journal</button>
  <button class="btn" id="bSet">Settings</button>
  <button class="btn" id="bCred">Credits</button>
  <div id="menuStats"></div>
</nav>
<div id="ver">v1.1</div>

<dialog id="dSet">
  <h2>Settings</h2>
  <button class="btn" id="snd" aria-pressed="false">Sound</button>
  <button class="btn" id="bLang">Language: English</button>
  <button class="btn" id="bReplay">Replay intro</button>
  <button class="btn" id="bReset">Delete save</button>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<dialog id="dCred">
  <h2>Credits</h2>
  <p>Map art and sound generated in code.</p>
  <p>Font: Silkscreen (Google Fonts).<a class="srcLink" href="https://fonts.google.com/specimen/Silkscreen" aria-label="Open source Silkscreen"></a></p>
  <p>Icons: pixelarticons by Gerrit Halfmann (MIT).<a class="srcLink" href="https://github.com/halfmage/pixelarticons" aria-label="Open source pixelarticons"></a></p>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<div id="levelSelect" hidden>
  <h2 id="lsTitle"></h2>
  <div id="lsList"></div>
  <div id="lsUp"><h3 id="lsUpTitle"></h3><div id="lsStars"></div><div id="lsUpList"></div></div>
  <button class="btn" id="lsBack"></button>
</div>
<div id="hud" hidden>
  <div id="hudRow"><span class="part" data-id="time" role="group"><b class="l"></b><span class="v"></span></span><span class="part" data-id="funds" role="group"><b class="l"></b><span class="v"></span></span><span class="part" data-id="crew" role="group"><b class="l"></b><span class="v"></span></span><span class="part" data-id="goodwill" role="group"><b class="l"></b><span class="v"></span></span><span class="part" data-id="wet" role="group"><b class="l"></b><span class="v"></span></span><span class="part" data-id="score" role="group"><b class="l"></b><span class="v"></span></span><i class="sep"></i></div>
  <div id="hudBtns"><button class="hb" id="bPause"></button><button class="hb" id="bX1"></button><button class="hb" id="bX2"></button><button class="hb" id="bData"></button><button class="hb" id="bJournal"></button><button class="hb" id="bHelp"></button><button class="hb" id="bMenu"></button></div>
  <div id="fireTag" role="status"><span></span><b aria-hidden="true"></b></div>
  <div id="legend"><div id="legendIn"><div id="legendBar"><b id="legendMark"></b></div><i></i><i></i><i></i></div></div>
</div>
<div id="bar" hidden>
  <div id="barName"></div>
  <div id="barHint"></div>
  <div id="barRow"><div id="slots"></div><div id="zoom" role="group"><div id="flow" role="img" hidden><canvas id="flowCv" width="20" height="12"></canvas></div><button id="bZoomIn"></button><button id="bZoomOut"></button><button id="bZoomFit"></button></div></div>
  <small id="hudKeys"></small>
</div>
<div id="tip" role="status" hidden></div>
<div id="report" hidden><h2 id="rpTitle"></h2><small id="rpChartLabel"></small><canvas id="rpChart" role="img" width="312" height="110"></canvas><div id="rpBody"></div><p id="rpElNino" hidden></p><button class="btn" id="rpCont"></button></div>
<div id="debrief" hidden>
  <h2 id="dbTitle"></h2><div id="dbStars" class="lsBest"></div><p id="dbBody"></p>
  <div id="dbThumbs"><figure><canvas id="dbBefore"></canvas><figcaption id="dbBeforeL"></figcaption></figure><figure><canvas id="dbAfter"></canvas><figcaption id="dbAfterL"></figcaption></figure></div>
  <h3 id="dbGoalsTitle"></h3><div id="dbGoals"></div><p id="dbHint"></p>
  <h3 id="dbDataTitle"></h3><canvas id="dbChart" role="img" width="312" height="110"></canvas><div id="dbData"></div>
  <button class="btn" id="dbView"></button><button class="btn" id="dbMenu"></button>
</div>
<div id="scenic" hidden><span id="scHint"></span><button class="btn" id="scBack"></button></div>
<dialog id="dJournal" aria-labelledby="jTitle">
  <div id="jHead"><button class="jb" id="jHome"></button><h2 id="jTitle"></h2><button class="jb" id="jClose" autofocus></button></div>
  <div id="jBook"></div>
  <div id="jNav"><button class="jb" id="jPrev"></button><span id="jPos" aria-live="polite"></span><button class="jb" id="jNext"></button></div>
  <small id="jHint"></small>
</dialog>
<dialog id="dHow" aria-labelledby="hTitle">
  <h2 id="hTitle"></h2><p id="hSub"></p>
  <canvas id="hMap" aria-hidden="true"></canvas>
  <div id="hCap" aria-live="polite"><span class="ic"></span><div><b id="hName"></b><p id="hText"></p></div></div>
  <div id="hNav"><button class="jb" id="hPrev"></button><span id="hPos"></span><button class="jb" id="hGo" autofocus></button></div>
  <small id="hHint"></small>
</dialog>
<dialog id="dMenu" aria-labelledby="mTitle"><h2 id="mTitle"></h2><button class="btn" id="mResume" autofocus></button><button class="btn" id="mSnd" aria-pressed="false"></button><button class="btn" id="mRestart"></button><button class="btn" id="mQuit"></button></dialog>
<dialog id="dFind" aria-labelledby="fTitle"><h2 id="fTitle"></h2><p id="fHint"></p><div id="fBody"></div><button class="btn" id="fJournal"></button><button class="btn" id="fGo" autofocus></button></dialog>
<dialog id="dQuit"><h2 id="qTitle"></h2><p id="qBody"></p><button class="btn" id="qYes"></button><button class="btn" id="qNo" autofocus></button></dialog>
<div id="toast" role="status"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
