<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rewet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#efe6cf;--dim:#a99f86;--accent:#e8b04a;--panel:#14120ecc;--line:#3a3328}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0d0b;color:var(--ink);font-family:VT323,monospace;font-size:22px;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
#intro{position:fixed;left:0;right:0;bottom:12vh;text-align:center;padding:0 16px;pointer-events:none}
#line{font-size:clamp(22px,3.4vw,34px);text-shadow:0 2px 0 #000;transition:opacity .6s}
#skip{position:fixed;right:16px;bottom:16px;font:inherit;font-size:18px;color:var(--dim);background:none;border:1px solid var(--line);padding:4px 10px;cursor:pointer}
#menu{position:fixed;left:max(16px,6vw);top:50%;transform:translateY(-50%);width:min(340px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .8s}
#menu.on{opacity:1;pointer-events:auto}
h1{font-family:Silkscreen,monospace;font-weight:400;font-size:clamp(44px,8vw,72px);margin:0;line-height:1;letter-spacing:2px;color:var(--ink);text-shadow:0 4px 0 #2d4a24}
.sub{color:var(--dim);margin:6px 0 28px}
.btn{display:block;width:100%;text-align:left;font-family:Silkscreen,monospace;font-size:18px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.btn:hover:not(:disabled)::before,.btn:focus-visible::before{content:"▶ "}
.btn:disabled{opacity:.4;cursor:default}
dialog{background:#14120e;color:var(--ink);border:2px solid var(--line);padding:20px;width:min(380px,calc(100% - 32px));font:inherit}
dialog::backdrop{background:#0008}
dialog h2{font-family:Silkscreen,monospace;font-size:20px;margin:0 0 14px}
dialog label{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
dialog p{margin:6px 0;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14120e;border:2px solid var(--accent);padding:8px 14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
@media (max-width:600px){#menu{top:auto;bottom:16px;transform:none}.sub{margin-bottom:16px}}
</style>
</head>
<body>
<canvas id="bg" aria-label="Pixel art peat swamp recovering from drought and fire"></canvas>

<div id="intro"><div id="line" aria-live="polite"></div></div>
<button id="skip">Skip ▸</button>

<nav id="menu" aria-label="Main menu">
  <h1>REWET</h1>
  <div class="sub">a peatland restoration game · prototype</div>
  <button class="btn" id="bNew">New game</button>
  <button class="btn" id="bCont" disabled>Continue</button>
  <button class="btn" id="bSet">Settings</button>
  <button class="btn" id="bCred">Credits</button>
</nav>

<dialog id="dSet">
  <h2>Settings</h2>
  <label>Sound <input type="checkbox" id="snd"></label>
  <button class="btn" id="bReplay">Replay intro</button>
  <button class="btn" id="bReset">Delete save</button>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<dialog id="dCred">
  <h2>Credits</h2>
  <p>Prototype. All art and sound generated in code.</p>
  <p>Fonts: Silkscreen, VT323 (Google Fonts).</p>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<div id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

// ---- world: 14x14 iso diorama, low-res buffer upscaled with image-rendering:pixelated
const cv = $('bg'), g = cv.getContext('2d');
const BW = 320, BH = 180; cv.width = BW; cv.height = BH;
const N = 14, TW = 16, TH = 8, D = 5;
const isCanal = (x, y) => y === 6 || (x === 9 && y > 6);
const DAMS = [[3, 6], [7, 6], [9, 10]];
const tiles = [];
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const i = y * N + x, c = isCanal(x, y);
  tiles.push({ x, y, i, c, r: hash(i), dam: DAMS.some(d => d[0] === x && d[1] === y),
    t: c ? 0.1 : 0.15 + hash(i + 99) * 0.55 }); // t: restoration progress at which this tile starts healing
}
tiles.sort((a, b) => a.x + a.y - (b.x + b.y));
console.assert(DAMS.every(([x, y]) => isCanal(x, y)), 'dams must sit on canals');
console.assert(clamp(2) === 1 && clamp(-1) === 0 && mix([0], [10], .5)[0] === 5, 'math helpers');

const DRY = [124, 88, 54], WET = [64, 50, 38], GREEN = [92, 132, 54], FOREST = [54, 98, 46];
function groundColor(p) {
  return p < 1/3 ? mix(DRY, WET, p * 3) : p < 2/3 ? mix(WET, GREEN, p * 3 - 1) : mix(GREEN, FOREST, p * 3 - 2);
}
function block(sx, sy, top, depth) {
  g.fillStyle = rgb(mix(top, [0, 0, 0], .35));
  for (let dx = 0; dx < 8; dx++) g.fillRect(sx - 8 + dx, sy + 4 + (dx >> 1), 1, depth);
  g.fillStyle = rgb(mix(top, [0, 0, 0], .55));
  for (let dx = 0; dx < 8; dx++) g.fillRect(sx + dx, sy + 8 - ((dx + 1) >> 1), 1, depth);
  g.fillStyle = rgb(top);
  for (let r = 0; r < TH; r++) { const w = r < 4 ? (r + 1) * 2 : (TH - r) * 2; g.fillRect(sx - w, sy + r, w * 2, 1); }
}
function blob(cx, cy, rad, col) {
  g.fillStyle = col;
  for (let dy = -rad; dy <= rad; dy++) { const w = Math.round(Math.sqrt(rad * rad - dy * dy)); g.fillRect(cx - w, cy + dy, w * 2 + 1, 1); }
}

const smoke = [];
function drawWorld(h, now, shift) {
  const sky = mix([86, 62, 48], [22, 38, 44], clamp(h * 1.4));
  for (let b = 0; b < 6; b++) { g.fillStyle = rgb(mix(sky, [10, 12, 12], b / 6)); g.fillRect(0, b * BH / 6, BW, BH / 6 + 1); }
  const ox = Math.round(BW / 2 + shift * 40), oy = 38 + Math.round(Math.sin(now / 1800) * 1.5);
  const water = clamp((h - 0.12) / 0.3);
  for (const T of tiles) {
    const sx = ox + (T.x - T.y) * TW / 2, sy = oy + (T.x + T.y) * TH / 2;
    const edge = T.x === N - 1 || T.y === N - 1, depth = edge ? D + 6 : D;
    const p = clamp((h - T.t) / 0.28);
    if (T.c) {
      block(sx, sy + 2, water > 0 ? mix([46, 40, 32], [52, 108, 136], water) : [46, 36, 28], depth - 2);
      if (water > 0 && ((now / 300 + T.i) | 0) % 5 === 0) { g.fillStyle = '#9fd4e8'; g.fillRect(sx - 2, sy + 5, 3, 1); }
      if (T.dam && h > 0.08) { g.fillStyle = '#8c6239'; g.fillRect(sx - 6, sy + 2, 12, 3); g.fillStyle = '#b5874f'; g.fillRect(sx - 6, sy + 2, 12, 1); }
      continue;
    }
    block(sx, sy, groundColor(p), depth);
    if (p < 0.15 && T.r < 0.25) { g.fillStyle = '#2a2420'; g.fillRect(sx + 1, sy - 2, 1, 6); }           // burnt snag
    if (h < 0.35 && p < 0.1 && T.r > 0.93) {                                                            // smouldering peat
      g.fillStyle = (now / 120 + T.i) % 3 < 1.5 ? '#f08a2c' : '#ffd25a'; g.fillRect(sx - 1, sy + 3, 2, 1);
      if (Math.random() < 0.06) smoke.push({ x: sx, y: sy, a: 1 });
    }
    if (p > 0.45 && p < 0.8 && T.r < 0.6) { g.fillStyle = '#a7c95e'; g.fillRect(sx - 3, sy + 3, 1, 2); g.fillRect(sx + 2, sy + 4, 1, 2); }
    if (p > 0.55 && T.r > 0.3) {
      const s = (p - 0.55) / 0.45, tall = 3 + Math.round(s * (4 + T.r * 4)), rad = 1 + Math.round(s * (2 + T.r * 2));
      g.fillStyle = '#4a3324'; g.fillRect(sx, sy + 4 - tall, 1, tall);
      blob(sx, sy + 4 - tall - rad + 1, rad, '#2f6b33');
      blob(sx - 1, sy + 4 - tall - rad, Math.max(0, rad - 1), '#5c9a45');
    }
  }
  for (let k = smoke.length - 1; k >= 0; k--) {
    const s = smoke[k]; s.y -= 0.25; s.x += 0.12; s.a -= 0.006;
    if (s.a <= 0) { smoke.splice(k, 1); continue; }
    g.fillStyle = `rgba(160,150,140,${s.a * 0.5})`; g.fillRect(s.x | 0, s.y | 0, 2, 2);
  }
}

// ---- sound: tiny WebAudio synth, no files
let ac = null, muted = store.get('rewet_mute') === '1';
function blip(f, d = 0.07, type = 'square', v = 0.035) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn).connect(ac.destination); o.start(t); o.stop(t + d);
  } catch {}
}

// ---- intro -> menu
const LINES = [[0, 'This peat swamp was once wet.'], [2.8, 'Canals drained it. Then it burned.'], [5.6, 'Block the canals. Rewet the peat. Replant.']];
const INTRO_END = 10.5;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let phase, t0, h, shown = -1;
function startIntro() { phase = 'intro'; t0 = performance.now(); h = 0; shown = -1; smoke.length = 0;
  $('menu').classList.remove('on'); $('intro').hidden = $('skip').hidden = false; }
function toMenu() {
  if (phase === 'menu') return;
  phase = 'menu'; $('intro').hidden = $('skip').hidden = true; $('menu').classList.add('on');
  $('bCont').disabled = !store.get('rewet_save');
  (store.get('rewet_save') ? $('bCont') : $('bNew')).focus({ preventScroll: true });
}
let shift = 0;
function frame(now) {
  if (phase === 'intro') {
    const t = (now - t0) / 1000;
    h = clamp((t - 5.6) / 4.5);
    const idx = LINES.reduce((n, l, i) => t >= l[0] ? i : n, 0);
    if (idx !== shown) { shown = idx; $('line').textContent = LINES[idx][1]; blip(220 + idx * 110, 0.12, 'triangle'); }
    if (t > INTRO_END) toMenu();
  } else h += (1 - h) * 0.04;
  shift += ((phase === 'menu' && innerWidth > 600 ? 1 : 0) - shift) * 0.05;
  drawWorld(h, now, shift);
  requestAnimationFrame(frame);
}
['click', 'keydown'].forEach(ev => addEventListener(ev, e => { if (phase === 'intro' && !e.target.closest?.('#skip')) toMenu(); }));
$('skip').onclick = toMenu;
reduce ? (phase = 'intro', toMenu(), h = 1) : startIntro();
requestAnimationFrame(frame);

// ---- menu actions
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
document.querySelectorAll('.btn').forEach(b => { b.addEventListener('mouseenter', () => !b.disabled && blip(660, 0.03)); b.addEventListener('click', () => blip(880, 0.06)); });
$('bNew').onclick = () => { store.set('rewet_save', JSON.stringify({ started: Date.now(), site: 0 })); $('bCont').disabled = false; toast('New game saved. Gameplay is not built yet.'); };
$('bCont').onclick = () => { const s = JSON.parse(store.get('rewet_save') || 'null'); toast(s ? `Save from ${new Date(s.started).toLocaleString()}. Gameplay is not built yet.` : 'No save.'); };
$('bSet').onclick = () => { $('snd').checked = !muted; $('dSet').showModal(); };
$('bCred').onclick = () => $('dCred').showModal();
$('snd').onchange = e => { muted = !e.target.checked; store.set('rewet_mute', muted ? '1' : '0'); blip(1320, 0.08); };
$('bReplay').onclick = e => { e.stopPropagation(); $('dSet').close(); startIntro(); }; // stop: the global click-to-skip would end the new intro at once
$('bReset').onclick = () => { store.set('rewet_save', null); $('bCont').disabled = true; toast('Save deleted.'); };
</script>
</body>
</html>
