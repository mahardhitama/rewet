# Netlify serves the repo root as a static site. The game has no build step.
[build]
  publish = "."
  command = ""

# Send each page and module through a cache check, so a new deploy shows at once.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
